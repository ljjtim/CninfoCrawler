name: Daily README Update

on:
  schedule:
    # 每天北京时间 01:30 运行一次（UTC 17:30）
    - cron: '30 17 * * *'
  workflow_dispatch: # 允许手动触发执行

# 与爬虫工作流共用队列，避免两个任务同时往 main 推送
concurrency:
  group: cninfo-daily
  cancel-in-progress: false

jobs:
  build:
    # 固定 24.04：actions/python-versions 没有 3.9 的 Ubuntu 26.04 构建包
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run update script
        run: python update_readme.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git commit -m "docs: 自动更新近7天公告表格 [skip ci]" || echo "No changes to commit"
          git push
