name: Probe Cninfo API

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYY-MM-DD'
        required: true
      max_pages:
        description: 'Max pages to probe'
        required: false
        default: '3'
      column:
        description: 'Cninfo column parameter'
        required: false
        default: 'szse'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Probe Cninfo API
        run: |
          python probe_cninfo_api.py \
            --date "${{ github.event.inputs.date }}" \
            --max-pages "${{ github.event.inputs.max_pages }}" \
            --column "${{ github.event.inputs.column }}"
