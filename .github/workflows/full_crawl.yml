name: Cninfo Full Announcement Crawl

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'daily, verify, or backfill'
        required: true
        default: 'daily'
      hot_window_days:
        description: 'daily rolling window days'
        required: false
        default: '3'
      verify_window_days:
        description: 'verify rolling window days'
        required: false
        default: '14'
      batch_days:
        description: 'backfill batch days'
        required: false
        default: '7'
      column:
        description: 'Cninfo column parameter'
        required: false
        default: 'szse'

concurrency:
  group: cninfo-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Crawl full announcement metadata
        run: |
          python crawl_all_announcements.py \
            --mode "${{ github.event.inputs.mode }}" \
            --hot-window-days "${{ github.event.inputs.hot_window_days }}" \
            --verify-window-days "${{ github.event.inputs.verify_window_days }}" \
            --batch-days "${{ github.event.inputs.batch_days }}" \
            --column "${{ github.event.inputs.column }}"

      - name: Build filtered exports and README
        run: |
          python filter_announcements.py
          python update_readme.py

      - name: Compile check
        run: |
          python -m py_compile CninfoCrawler1.py cninfo_service.py crawl_all_announcements.py filter_announcements.py storage_csv.py crawl_state.py cninfo_models.py probe_cninfo_api.py update_readme.py

      - name: Commit crawl output
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/ data/state/ exports/ announcements.csv README.md || true
          if git diff --staged --quiet; then echo "No changes to commit"; else git commit -m "Auto-update cninfo full announcements" && git pull --rebase && git push; fi
