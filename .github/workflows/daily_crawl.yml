name: Daily Cninfo Crawl

# 触发条件
on:
  schedule:
    # 每天北京时间 01:00 运行一次（UTC 17:00）
    - cron: '0 17 * * *'
  workflow_dispatch: # 允许手动点击按钮触发

# 与 README 工作流共用队列，避免两个任务同时往 main 追加数据
concurrency:
  group: cninfo-daily
  cancel-in-progress: false

jobs:
  build:
    # 固定 24.04：actions/python-versions 没有 3.9 的 Ubuntu 26.04 构建包
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - name: 检出代码
      uses: actions/checkout@v5
      with:
        # 推送前要 rebase，需要完整历史
        fetch-depth: 0

    - name: 设置 Python 环境
      uses: actions/setup-python@v6
      with:
        python-version: '3.9'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 执行爬虫
      run: |
        python "CninfoCrawler1.py"

    - name: 校验近 7 天数据并补齐遗漏
      run: |
        # 用 UTC 日期算窗口，与爬虫的 get_default_date_range 一致
        START_DATE=$(date -u -d '7 days ago' +%F)
        END_DATE=$(date -u +%F)
        echo "校验区间: ${START_DATE} ~ ${END_DATE}"
        python verify_csv_integrity.py --start-date "${START_DATE}" --end-date "${END_DATE}" --repair

    - name: 提交并推送结果
      run: |
        # 配置用户信息
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # 检查是否有文件更新
        git add announcements.csv
        
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Auto-update data: $(date +'%Y-%m-%d %H:%M')"
          # 先同步远端，避免与 README 工作流同时推送时被拒
          git pull --rebase origin main
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
        fi
